name: decision-note
version: "1.0.0"
description: >-
  Architectural Decision Records (ADRs) and basic-memory decision notes. High
  formality, high confidence, low verbosity. Flags missing structure (Status /
  Context / Decision / Consequences), missing rationale, and AI attribution.
author: claude-config
tags:
  - decision
  - adr
  - architecture
  - rationale
channels:
  - decision-note

tone:
  formality: 0.85
  confidence: 0.85
  warmth: 0.2
  directness: 0.85
  energy: 0.3
  verbosity: 0.35

rules:
  - id: dn-no-ai-attribution
    type: existence
    level: error
    message: "AI attribution forbidden in decision notes (safety.md §No AI Attribution). Tool, not author."
    tokens:
      - co-authored by claude
      - written by claude
      - generated by ai
      - generated by an ai
      - ai-assisted
      - assisted by claude
      - claude wrote
      - chatgpt wrote
      - llm wrote

  - id: dn-no-internal-tooling-paths
    type: existence
    level: error
    message: "Internal tooling reference in user-facing decision (safety.md §No Internal Tooling References)."
    tokens:
      - .kiro/
      - meta-lesson
      - meta-optimis
      - mcp_mcp_python
      - invokeSubAgent
      - steering file

  - id: dn-needs-status
    type: occurrence
    level: warning
    message: "Decision note should declare a Status (Proposed / Accepted / Deprecated / Superseded)."
    scope: document
    min: 1
    raw:
      - "(?i)\\bstatus\\s*[:|\\-]\\s*(?:proposed|accepted|deprecated|superseded|in.?flight)\\b"
  - id: dn-needs-rationale
    type: occurrence
    level: warning
    message: "Decision note should explain WHY (Why / Rationale / Reason / Because section or token)."
    scope: document
    min: 1
    raw:
      - "(?i)\\b(?:why|rationale|reason(?:ing)?|because)\\b"
  - id: dn-needs-consequences
    type: occurrence
    level: warning
    message: "Decision note should describe Consequences (positive + negative tradeoffs)."
    scope: document
    min: 1
    raw:
      - "(?i)\\b(?:consequences|tradeoffs|trade-offs|implications|costs|risks)\\b"
  - id: dn-no-superlatives-without-evidence
    type: existence
    level: warning
    message: "Superlative without evidence — back with measurement or remove (delegation-contract.md §6)."
    tokens:
      - the best solution
      - the optimal choice
      - the perfect approach
      - the only way
      - clearly superior
      - obviously correct

  - id: dn-no-vague-temporal
    type: existence
    level: warning
    message: "Vague temporal reference — use absolute date (anti-hallucination.md)."
    tokens:
      - recently
      - lately
      - the other day
      - a while back
      - earlier
      - sometime soon
      - eventually

  - id: dn-no-marketing-fluff
    type: existence
    level: warning
    message: "Marketing fluff — decision notes describe technical rationale, not value prop."
    tokens:
      - cutting-edge
      - state-of-the-art
      - best-in-class
      - revolutionary
      - game-changing
      - paradigm shift
      - synergy
      - leverage
      - turnkey
