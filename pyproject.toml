[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phraseturner"
version = "0.2.0"
description = "Text analysis MCP server with configurable personas for readability, naturalness, tone, and AI detection"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "geehexx", email = "geehexx@users.noreply.github.com"},
]
keywords = ["mcp", "text-analysis", "writing-quality", "nlp", "fastmcp", "readability", "naturalness", "persona", "style-guide", "ai-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=3.2.0",
    "spacy>=3.8",
    "textstat>=0.7.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "PyYAML>=6.0",
    "structlog>=24.0",
    "watchfiles>=0.24",
    "scipy>=1.14",
    "lexicalrichness>=0.5",
    "vaderSentiment>=3.3",
    "onnxruntime>=1.18",
    "fastembed>=0.4",
    "is-it-slop>=0.5.0",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/geehexx/phraseturner"
Documentation = "https://geehexx.github.io/phraseturner"
Changelog = "https://github.com/geehexx/phraseturner/blob/main/CHANGELOG.md"
Issues = "https://github.com/geehexx/phraseturner/issues"
Repository = "https://github.com/geehexx/phraseturner"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-randomly>=3.15",
    "pytest-timeout>=2.4",
    "pytest-xdist>=3.7",
    "hypothesis>=6.100",
    "mypy>=1.13",
    "ruff>=0.15",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.scripts]
phraseturner = "phraseturner.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/phraseturner"]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
    "PL",   # pylint
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "PLC0415"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 30
filterwarnings = [
    "error:coroutine .* was never awaited:RuntimeWarning",
    "error:Precision loss occurred in moment calculation:RuntimeWarning",
    "error:Exception ignored in.*coroutine:pytest.PytestUnraisableExceptionWarning",
    "ignore::DeprecationWarning",
]
testpaths = ["tests"]
addopts = "--cov-fail-under=80"
markers = [
    "unit: fast, isolated tests with no external dependencies",
    "integration: tests requiring model loading (1-10s)",
    "slow: full model stack tests (>10s, excluded from default CI)",
    "properties: Hypothesis property-based tests",
]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260408",
]

[[tool.mypy.overrides]]
module = "textstat"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lexicalrichness"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "vaderSentiment.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "is_it_slop.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "onnxruntime.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fastembed.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "spacy.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/phraseturner"]
omit = ["*/tests/*", "*/__main__.py"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
